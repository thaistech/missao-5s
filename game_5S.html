<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Missão 5S | Inkly Solutions</title>
<style>
:root{
  --navy:#071a33; --navy2:#0c2748; --gold:#c79a43; --gold2:#e0b65d;
  --white:#fff; --ink:#10233d; --muted:#6c7a8d; --line:#d9e1eb;
  --ok:#1f9d70; --bad:#c94545; --soft:#f4f7fb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,sans-serif;background:var(--navy);color:var(--white)}
body{overflow:hidden}
button{font:inherit}
.screen{position:absolute;inset:0;display:none;grid-template-rows:auto 1fr auto;background:
radial-gradient(circle at 85% 12%,rgba(199,154,67,.18),transparent 30%),
linear-gradient(145deg,var(--navy),#031226 70%);}
.screen.active{display:grid}
.top{padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-mini{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.7px;font-size:12px}
.brand-mini img{width:80px;height:auto;display:block;background:#fff;border-radius:10px;padding:6px}
.progress{font-size:12px;color:#d5deeb;font-weight:700}
.center{min-height:0;display:flex;align-items:center;justify-content:center;padding:20px}
.bottom{padding:0 22px 22px;display:flex;justify-content:center}
.card{width:min(920px,94vw);background:#fff;color:var(--ink);border-radius:28px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.28);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(var(--gold2),var(--gold))}
.kicker{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
h1,h2,p{margin-top:0}
h1{font-size:clamp(40px,8vw,82px);line-height:.95;margin-bottom:14px;color:#fff;text-align:center}
.hero-sub{font-size:clamp(16px,2.5vw,23px);text-align:center;color:#dce7f5;max-width:720px;margin:0 auto 28px;line-height:1.35}
.logo-hero{width:min(330px,60vw);display:block;margin:0 auto 26px;background:#fff;border-radius:18px;padding:14px 20px}
.primary{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#172236;font-weight:900;border-radius:16px;padding:15px 28px;min-width:210px;box-shadow:0 12px 25px rgba(199,154,67,.25);cursor:pointer}
.primary:active{transform:scale(.98)}
.stars{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px auto 0}
.star{width:74px;height:74px;border-radius:20px;border:2px solid rgba(255,255,255,.28);display:grid;place-items:center;position:relative;background:rgba(255,255,255,.07);transition:.35s}
.star .icon{font-size:36px;filter:grayscale(1);opacity:.35}
.star .tag{position:absolute;bottom:5px;font-size:8px;font-weight:900;letter-spacing:.5px;color:#dce5f2}
.star.won{background:linear-gradient(145deg,#fff7dd,#f0c86e);border-color:#ffe6a3;box-shadow:0 0 28px rgba(225,180,82,.35)}
.star.won .icon{filter:none;opacity:1;animation:pop .5s ease}
.star.won .tag{color:#61480e}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
.stage-pill{background:#eef3f9;color:#43546a;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900;white-space:nowrap}
.question{font-size:clamp(22px,4vw,38px);line-height:1.15;margin-bottom:10px}
.context{color:var(--muted);font-size:clamp(14px,2vw,18px);line-height:1.45;margin-bottom:22px}
.options{display:grid;gap:12px}
.opt{border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left;border-radius:18px;padding:16px 18px;cursor:pointer;font-weight:800;line-height:1.35;transition:.2s}
.opt:hover{border-color:#b9c7d8;transform:translateY(-1px)}
.opt.correct{border-color:var(--ok);background:#ecfbf5}
.opt.wrong{border-color:var(--bad);background:#fff0f0}
.opt.locked{pointer-events:none}
.feedback{margin-top:18px;border-radius:16px;padding:15px 16px;display:none;font-size:14px;line-height:1.4}
.feedback.show{display:block}
.feedback.ok{background:#eaf9f3;color:#176d50}
.feedback.no{background:#fff0f0;color:#8a2f2f}
.sense-reveal{display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(0,0,0,.08)}
.sense-badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe7a6,#d7a642);font-size:22px}
.sense-name b{display:block;font-size:15px}
.sense-name small{color:inherit;opacity:.8}
.next{margin-top:16px;display:none}
.next.show{display:inline-block}
.result-wrap{text-align:center}
.result-title{font-size:clamp(30px,6vw,62px);margin:0 0 8px}
.score-big{font-size:clamp(48px,9vw,90px);font-weight:1000;color:var(--gold);line-height:1}
.result-copy{color:#d8e3ef;font-size:18px;max-width:680px;margin:12px auto 20px;line-height:1.45}
.final-badge{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:20px;padding:14px 18px;font-weight:900;margin-top:12px}
.final-stars{font-size:28px;letter-spacing:3px;color:var(--gold)}
.signature{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:3px}
.signature img{width:min(230px,52vw);background:#fff;border-radius:14px;padding:10px 14px}
.signature .slogan{font-size:12px;color:#e8edf4;white-space:nowrap}
.note{font-size:12px;color:#9fb0c4;text-align:center;margin-top:10px}
@media(max-width:600px){
 .top{padding:13px 14px 0} .center{padding:12px} .bottom{padding:0 14px 14px}
 .card{padding:22px 18px;border-radius:22px} .qhead{gap:8px}
 .star{width:55px;height:55px;border-radius:15px} .star .icon{font-size:27px} .star .tag{font-size:7px}
 .logo-hero{width:230px;margin-bottom:18px}
 .options{gap:9px} .opt{padding:13px 14px;border-radius:14px;font-size:14px}
 .feedback{font-size:13px} .signature .slogan{font-size:10px}
}

.gamification-final{
  margin-top:16px;
  font-size:clamp(17px,3vw,27px);
  line-height:1;
  font-weight:900;
  letter-spacing:2.2px;
  color:#e6bd66;
  text-align:center;
  white-space:nowrap;
}
@media(max-width:480px){
  .gamification-final{
    font-size:clamp(14px,4vw,19px);
    letter-spacing:1.3px;
  }
}

</style>
</head>

  why:"Seiketsu transforma boas práticas em padrões claros e repetíveis — o Senso de Padronização."
 },
 {
  sense:"SHITSUKE", label:"Disciplina", icon:"⭐",
  q:"O 5S começou bem, mas os hábitos antigos estão voltando. E agora?",
  ctx:"Dois meses após a implantação, as marcações continuam no lugar, mas a equipe deixou de seguir alguns padrões e as verificações estão sendo ignoradas.",
  opts:[
   "Refazer toda a implantação desde o início.",
   "Reforçar rotina, liderança pelo exemplo, acompanhamento e responsabilidade pelos padrões.",
   "Criar mais cartazes para lembrar as regras."
  ], correct:1,
  why:"Shitsuke é sustentar o comportamento no dia a dia. Disciplina nasce de rotina, exemplo, acompanhamento e responsabilidade."
 }
];

let idx=0, stars=0, answered=false;
const won=[false,false,false,false,false];

function starHTML(i, earned=false){
 const tag = earned ? data[i].label.toUpperCase() : "S " + (i+1);
 return `<div class="star ${earned?'won':''}"><div class="icon">⭐</div><div class="tag">${tag}</div></div>`;
}
function renderStars(target){
 document.getElementById(target).innerHTML=data.map((_,i)=>starHTML(i,won[i])).join("");
}
renderStars("introStars");

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
function startGame(){
 idx=0;stars=0;answered=false;won.fill(false);
 renderStars("gameStars"); show("game"); renderQuestion();
}
function renderQuestion(){
 answered=false;
 const d=data[idx];
 document.getElementById("progressText").textContent=`DESAFIO ${idx+1} DE 5`;
 document.getElementById("stagePill").textContent=`${idx+1}/5`;
 document.getElementById("question").textContent=d.q;
 document.getElementById("context").textContent=d.ctx;
 document.getElementById("feedback").className="feedback";
 document.getElementById("feedback").innerHTML="";
 document.getElementById("nextBtn").className="primary next";
 document.getElementById("nextBtn").textContent = idx===4 ? "VER RESULTADO" : "PRÓXIMO DESAFIO";
 const opts=document.getElementById("options");
 opts.innerHTML="";
 d.opts.forEach((text,i)=>{
  const b=document.createElement("button");
  b.className="opt"; b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${text}`;
  b.onclick=()=>answer(i,b); opts.appendChild(b);
 });
 renderStars("gameStars");
}
function answer(choice,btn){
 if(answered) return;
 answered=true;
 const d=data[idx];
 const all=[...document.querySelectorAll(".opt")];
 all.forEach(x=>x.classList.add("locked"));
 const fb=document.getElementById("feedback");
 if(choice===d.correct){
   stars++; won[idx]=true; btn.classList.add("correct");
   fb.className="feedback show ok";
   fb.innerHTML=`<b>ESTRELA CONQUISTADA! ⭐</b><div class="sense-reveal"><div class="sense-badge">⭐</div><div class="sense-name"><b>${d.sense} — ${d.label}</b><small>${d.why}</small></div></div>`;
 } else {
   btn.classList.add("wrong"); all[d.correct].classList.add("correct");
   fb.className="feedback show no";
   fb.innerHTML=`<b>NESTA MISSÃO, A MELHOR DECISÃO ERA OUTRA.</b><div class="sense-reveal"><div class="sense-badge">☆</div><div class="sense-name"><b>${d.sense} — ${d.label}</b><small>${d.why}</small></div></div>`;
 }
 renderStars("gameStars");
 document.getElementById("nextBtn").className="primary next show";
}
function nextQuestion(){
 if(idx<4){idx++;renderQuestion();} else finish();
}
function finish(){
 show("result");
 document.getElementById("scoreNum").textContent=stars;
 document.getElementById("resultStars").textContent="★".repeat(stars)+"☆".repeat(5-stars);
 const title=document.getElementById("resultTitle"), copy=document.getElementById("resultCopy"), badge=document.getElementById("finalBadge");
 if(stars===5){
   title.textContent="5 ESTRELAS CONQUISTADAS";
   copy.textContent="Você reconheceu os cinco sensos e tomou decisões alinhadas ao 5S em todas as etapas. Missão completa.";
   badge.textContent="★★★★★ DOMÍNIO DOS 5S";
 } else if(stars>=4){
   title.textContent="QUASE 5 ESTRELAS";
   copy.textContent="Seu resultado mostra boa compreensão do 5S. Um pequeno ajuste separa uma boa aplicação de uma execução consistente.";
   badge.textContent="⭐ NÍVEL AVANÇADO";
 } else if(stars>=2){
   title.textContent="MISSÃO EM DESENVOLVIMENTO";
   copy.textContent="Você já reconhece parte dos princípios. Reveja as decisões e tente novamente para conquistar as cinco estrelas.";
   badge.textContent="⭐ NÍVEL INTERMEDIÁRIO";
 } else {
   title.textContent="HORA DE REFORÇAR OS SENSOS";
   copy.textContent="O 5S vai além de organizar e limpar. Tente novamente observando o objetivo de cada senso.";
   badge.textContent="⭐ NÍVEL INICIAL";
 }
}
function restart(){show("intro");won.fill(false);renderStars("introStars");}
</script>
</body>
</html>
